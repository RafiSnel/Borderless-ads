<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Borderless ad "Lying" — every frame is a pure function of t (seconds). 1080x1920.

// ---------- assets ----------

  mles: 'app/madrid_lesson_1.png', tles: 'app/tokio_lesson_1.png', mover: 'app/madrid_overview.png', tover: 'app/tokio_overview.png',

window.ready = Promise.all(Object.entries(SRC).map(([k, s]) => new Promise((r) => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.src = s; })))

// ---------- primitives ----------

// Big key word that slams in on the beat. Returns nothing; draws centred at (x,y).

// A rubber stamp: bordered word, slight rotation, ink texture.
function stamp(t, t0, text, x, y, size, color, rot) {

// Phone frame showing an image; scrollY in image pixels (image scaled to the screen width).

// ---------- the mascot: a little passport with eyes ----------

    } else {

      X.fillStyle = P.ink; X.beginPath(); X.arc(lookX, lookY + 4, st.wide ? 11 : 13, 0, 7); X.fill();
      X.fillStyle = P.white; X.beginPath(); X.arc(lookX + 4, lookY - 1, 4, 0, 7); X.fill();

function bubble(text, x, y, size, a = 1, s = 1, tail = 'left') {

// Generic (unbranded) "lesson card" used for the sameness grid.
function lessonCard(x, y, w, s, a, col, tick) {

function confetti(t, t0, cx, cy, n = 40) {

// ---------- timeline (measured voiceover, ad #2) ----------
const T = {
  l1: 0.15, l2: 1.595, built: 2.03, l3: 3.208, l4: 5.512, animals: 6.15, cat: 6.83, l5: 8.109, madrid: 9.6,
  l6: 10.808, why: 12.1, l7: 13.109, l8: 14.175, fifty: 14.85, exactly: 15.915, l9: 16.994, tokyo: 18.394,
  l10: 20.549, l11: 22.199, around: 23.079, l12: 24.396, l13: 26.489, end: 27.6, out: 30.0,

// ---------- new props ----------
function codeWindow(t, t0, x, y, w, h, a = 1) {
  const k = t - t0;
